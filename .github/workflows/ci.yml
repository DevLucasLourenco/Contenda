name: CI

# Todo push, em qualquer branch, e todo PR — não só main. Trabalho em
# feature/* precisa de retorno antes de existir PR.
on: [push, pull_request]

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar
        run: dotnet restore Contenda.sln

      # ATENÇÃO: a configuração é ExportRelease, não Release.
      # O Godot.NET.Sdk define Debug, ExportDebug e ExportRelease — `Release`
      # não existe, e um .sln gerado automaticamente mapeia Release para Debug,
      # compilando Debug em silêncio. Ver docs/plans/m0-fundacao.md.
      - name: Compilar (ExportRelease, warning = erro)
        run: dotnet build Contenda.sln -c ExportRelease --no-restore

      - name: Verificar que warning reprova a build
        run: bash tools/check-warnings-as-errors.sh

      - name: Testes unitários
        run: dotnet test tests/Contenda.Tests/Contenda.Tests.csproj --no-restore --verbosity normal

  regra-2d:
    name: Nenhum nó 2D no gameplay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A regra não negociável número 1 do projeto, aplicada por máquina em vez
      # de por disciplina. Ver docs/specs/02-camera-e-mundo-25d.md §2.

      # Um verificador que nunca falhou é um passo verde inútil: se o script
      # quebrar de um jeito que o faça sempre passar, ninguém percebe. O
      # autoteste roda primeiro e prova que ele ainda acusa violação.
      - name: Autoteste do verificador
        run: bash tools/check-no-2d.sh --self-test

      - name: Nenhum nó 2D no gameplay
        run: bash tools/check-no-2d.sh

  godot-import:
    name: Import do Godot .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Baixar Godot .NET 4.7.2
        run: bash tools/setup-godot-mono.sh

      - name: Restaurar e compilar projeto C# para o editor
        run: |
          dotnet restore Contenda.sln
          dotnet build Contenda.csproj -c Debug --no-restore

      - name: Importar assets no Godot (bloqueante)
        run: "$GODOT_BIN --headless --editor --path . --import"
